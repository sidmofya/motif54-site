  <path d="M124 236C132 212 150 198 166 198C182 198 200 212 208 236Z" fill="#3A3036" stroke="#A2A0A6" stroke-width="1.6"/>
  <g fill="#D08A5A" fill-opacity=".8"><circle cx="150" cy="222" r="1.8"/><circle cx="166" cy="212" r="1.8"/><circle cx="180" cy="224" r="1.8"/><circle cx="160" cy="228" r="1.5"/><circle cx="172" cy="220" r="1.5"/><circle cx="190" cy="230" r="1.5"/></g>
  <!-- 3 anode -->
  <g fill="url(#cu)" stroke="#D08A5A" stroke-width="1.2" stroke-opacity=".6">
