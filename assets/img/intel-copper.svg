  <path d="M520 140V228" stroke="#D08A5A" stroke-width="3"/>
  <g stroke="#8C8A93" stroke-width="1"><path d="M490 146H514M490 158H514M490 170H514M490 182H514M490 194H514M490 206H514M490 218H514"/></g>
