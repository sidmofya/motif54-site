<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" width="560" height="360" role="img" aria-labelledby="t">
  <title id="t">Illustration: copper changing form from rock to an installed conductor</title>
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0A47A"/>
      <stop offset="1" stop-color="#9E5F35"/>
