    <path d="M40 0V360M80 0V360M120 0V360M160 0V360M200 0V360M240 0V360M280 0V360M320 0V360M360 0V360M400 0V360M440 0V360M480 0V360M520 0V360"/>
  </g>
  <path d="M28 236H532" stroke="#8C8A93" stroke-width="1" stroke-dasharray="2 6"/>
