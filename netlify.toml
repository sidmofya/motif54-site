# Netlify configuration for motif54.com
# Static site with no build step. The repository root is the published site,
# plus one Netlify function (netlify/functions/inquiry.mjs) for the inquiry
# form. Unknown paths fall through to 404.html with a real 404 status.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Publish guard. The repository root is the publish directory, so every
# committed file would otherwise be served. These force rules return the
# site's 404 page for repository-only material: the inquiry function's
# source, tests, review documents, the README and the Apps Script source.
# They come first so nothing below can shadow them.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/apps-script.gs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Legacy URLs. Retired pages point at the service that absorbed them.
# 301s come first; the extensionless rewrites at the bottom must not shadow
# them, since Netlify applies the first matching rule.
#
# Netlify does not chain redirects, so every retired path points straight at
# its final destination rather than at another retired path.
# ---------------------------------------------------------------------------

# Assess absorbed Intelligence, and with it Strategic Asset Intelligence,
# Decision Rooms, and the Gate Diagnostic.
[[redirects]]
  from = "/strategic-asset-intelligence"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/strategic-asset-intelligence.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/decision-rooms"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/decision-rooms.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/situation-room.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/intelligence-feed.html"
  to = "/assess"
  status = 301
  force = true

# Programs retired: Partner Room is sold personally under Sid Mofya, and
# Capital Readiness folded into the assessment offer.
[[redirects]]
  from = "/programs"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/programs.html"
  to = "/assess"
  status = 301
  force = true

# /intelligence and /intelligence.html redirected to /assess until November
# 2026. They now serve the intelligence index again (see the rewrites below),
# so they must not reappear here.

# Critical Minerals is a sector, not a page. Land on the Kafwego card.
[[redirects]]
  from = "/critical-minerals"
  to = "/projects#critical-minerals"
  status = 301
  force = true

[[redirects]]
  from = "/critical-minerals.html"
  to = "/projects#critical-minerals"
  status = 301
  force = true

# The enquiry route is now Work With Us.
[[redirects]]
  from = "/request-access"
  to = "/work-with-us"
  status = 301
  force = true

[[redirects]]
  from = "/request-access.html"
  to = "/work-with-us"
  status = 301
  force = true

[[redirects]]
  from = "/briefing.html"
  to = "/work-with-us"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Canonical extensionless routes. Netlify serves these from the .html files by
# default; declaring them as 200 rewrites makes the behaviour explicit rather
# than relying on the platform default.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/intelligence"
  to = "/intelligence.html"
  status = 200

[[redirects]]
  from = "/intelligence/what-ai-is-made-of"
  to = "/intelligence/what-ai-is-made-of.html"
  status = 200

[[redirects]]
  from = "/intelligence/from-copper-to-compute"
  to = "/intelligence/from-copper-to-compute.html"
  status = 200

[[redirects]]
  from = "/advisory"
  to = "/advisory.html"
  status = 200

[[redirects]]
  from = "/approach"
  to = "/approach.html"
  status = 200

[[redirects]]
  from = "/screen"
  to = "/screen.html"
  status = 200

[[redirects]]
  from = "/assess"
  to = "/assess.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/work-with-us"
  to = "/work-with-us.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Security / caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Only vendor files are cached forever: their filenames carry the library
# version, so a new version is a new URL. Everything else under /assets/
# keeps a stable name (style.css, motion.js, ...) and must revalidate, or
# returning browsers pair new HTML with last month's CSS. Netlify's default
# (max-age=0, must-revalidate, with ETags) handles that.
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
