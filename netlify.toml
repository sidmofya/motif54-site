# Netlify configuration for motif54.com
# Static site — no build step. The repository root IS the published site.

[build]
  publish = "."
  command = ""

# ---------------------------------------------------------------------------
# Legacy URLs → the Screen · Assess architecture.
# 301s come first; the extensionless rewrites at the bottom must not shadow
# them, since Netlify applies the first matching rule.
#
# Netlify does not chain redirects, so every retired path points straight at
# its final destination rather than at another retired path.
# ---------------------------------------------------------------------------

# Assess absorbed Intelligence, and with it Strategic Asset Intelligence,
# Decision Rooms, and the Gate Diagnostic.
[[redirects]]
  from = "/strategic-asset-intelligence"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/strategic-asset-intelligence.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/decision-rooms"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/decision-rooms.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/situation-room.html"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/intelligence-feed.html"
  to = "/assess"
  status = 301
  force = true

# Programs retired: Partner Room is sold personally under Sid Mofya, and
# Capital Readiness folded into the assessment offer.
[[redirects]]
  from = "/programs"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/programs.html"
  to = "/assess"
  status = 301
  force = true

# Intelligence retired as a pillar; its content redistributed into the two doors.
[[redirects]]
  from = "/intelligence"
  to = "/assess"
  status = 301
  force = true

[[redirects]]
  from = "/intelligence.html"
  to = "/assess"
  status = 301
  force = true

# Critical Minerals is a sector, not a page. Land on the Kafwego card.
[[redirects]]
  from = "/critical-minerals"
  to = "/projects#critical-minerals"
  status = 301
  force = true

[[redirects]]
  from = "/critical-minerals.html"
  to = "/projects#critical-minerals"
  status = 301
  force = true

# The enquiry route is now Work With Us.
[[redirects]]
  from = "/request-access"
  to = "/work-with-us"
  status = 301
  force = true

[[redirects]]
  from = "/request-access.html"
  to = "/work-with-us"
  status = 301
  force = true

[[redirects]]
  from = "/briefing.html"
  to = "/work-with-us"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Canonical extensionless routes. Netlify serves these from the .html files by
# default; declaring them as 200 rewrites makes the behaviour explicit rather
# than relying on the platform default.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/screen"
  to = "/screen.html"
  status = 200

[[redirects]]
  from = "/assess"
  to = "/assess.html"
  status = 200

[[redirects]]
  from = "/projects"
  to = "/projects.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/work-with-us"
  to = "/work-with-us.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

# Security / caching headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
